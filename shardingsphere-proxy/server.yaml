mode:
  type: Memory
  repository:
    type: Memory

dataSources:
  ds_master:
    url: jdbc:mysql://ds_master:3306/demo?serverTimezone=UTC&useSSL=false
    username: demo
    password: demo
    connectionTimeoutMilliseconds: 30000
  ds_slave_0:
    url: jdbc:mysql://ds_slave_0:3306/demo?serverTimezone=UTC&useSSL=false
    username: demo
    password: demo
    connectionTimeoutMilliseconds: 30000
  ds_slave_1:
    url: jdbc:mysql://ds_slave_1:3306/demo?serverTimezone=UTC&useSSL=false
    username: demo
    password: demo
    connectionTimeoutMilliseconds: 30000

rules:
  - !READWRITE_SPLITTING
    dataSources:
      rw_ds:
        writeDataSourceName: ds_master
        readDataSourceNames:
          - ds_slave_0
          - ds_slave_1
        loadBalancerName: round_robin

    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

  - !SHARDING
    tables:
      t_user:
        actualDataNodes: rw_ds.t_user
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_mod
    shardingAlgorithms:
      user_mod:
        type: MOD
        props:
          sharding-count: 2